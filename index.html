<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗社作品板块 · DEMO 演示</title>
<style>
/* ============================================================
   设计变量：改这里就能换整套配色 / 字体
   ============================================================ */
:root{
  --paper:      #f6f2e9;   /* 页面底色：宣纸 */
  --card:       #fffdf8;   /* 卡片底色 */
  --ink:        #1f1d1a;   /* 主文字：墨 */
  --ink-soft:   #5c5750;   /* 次要文字 */
  --ink-faint:  #948c80;   /* 弱化文字 */
  --line:       #e5ded0;   /* 分隔线 */
  --seal:       #a8342a;   /* 点缀：朱砂 */
  --shadow:     0 1px 2px rgb(60 50 30 / .06);

  --serif: "Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
  --sans:  system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}

*{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  /* 宣纸质感：极淡的斜纹，不需要可以删掉这一行 */
  background-image: repeating-linear-gradient(45deg, rgb(0 0 0 /.012) 0 1px, transparent 1px 4px);
}
button{ font: inherit; color: inherit; cursor: pointer; }
:focus-visible{ outline: 2px solid var(--seal); outline-offset: 2px; border-radius: 4px; }

/* ============================================================
   1. 页头
   ============================================================ */
.hero{
  position: relative;
  max-width: 1240px;
  margin: 0 auto;
  padding: 64px 24px 36px;
  overflow: hidden;
}
.hero__eyebrow{
  margin: 0 0 14px;
  font-size: 12px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
/* 演示标记：交付给组长/组员时一眼能看出这是 DEMO 而不是正式页 */
.demo-badge{
  margin-left: 10px;
  padding: 2px 9px;
  border: 1px dashed var(--seal);
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--seal);
}
.hero__title{
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(34px, 6vw, 54px);
  font-weight: 500;
  letter-spacing: .12em;
}
.hero__sub{
  margin: 14px 0 0;
  color: var(--ink-soft);
  font-size: 15px;
  letter-spacing: .04em;
}
.hero__stats{
  margin: 22px 0 0;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  max-width: 420px;
  color: var(--ink-faint);
  font-size: 13px;
  letter-spacing: .1em;
}
/* 朱砂印章 */
.seal{
  position: absolute;
  top: 70px; right: 26px;
  width: 60px; height: 60px;
  display: grid; place-items: center;
  border: 2px solid var(--seal);
  border-radius: 6px;
  color: var(--seal);
  font-family: var(--serif);
  font-size: 30px;
  line-height: 1;
  opacity: .85;
  transform: rotate(-4deg);
  user-select: none;
}
/* 右侧竖排装饰句 */
.hero__vertical{
  position: absolute;
  top: 60px; right: 120px;
  writing-mode: vertical-rl;
  font-family: var(--serif);
  font-size: 15px;
  letter-spacing: .4em;
  color: var(--ink-faint);
  opacity: .7;
  user-select: none;
}

/* ============================================================
   2. 工具栏：搜索 + 筛选
   ============================================================ */
.toolbar{
  position: sticky; top: 0; z-index: 20;
  max-width: 1240px;
  margin: 0 auto;
  padding: 14px 24px 16px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.toolbar__row{ display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.search{ position: relative; flex: 1; max-width: 420px; }
.search input{
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  font: inherit;
  font-size: 14px;
  color: var(--ink);
}
.search input::placeholder{ color: var(--ink-faint); }

.filters{
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 8px;
}
.filters__label{
  align-self: center;
  margin-right: 2px;
  font-size: 12px;
  letter-spacing: .16em;
  color: var(--ink-faint);
}
.chip{
  padding: 5px 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  font-size: 13px;
  color: var(--ink-soft);
  transition: background .18s, color .18s, border-color .18s;
}
.chip:hover{ border-color: var(--ink-faint); color: var(--ink); }
.chip[aria-pressed="true"]{
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.chip small{ opacity: .55; margin-left: 4px; font-size: 11px; }

.btn-ghost{
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  font-size: 13px;
  color: var(--ink-soft);
  white-space: nowrap;
}
.btn-ghost:hover{ border-color: var(--ink-faint); color: var(--ink); }

/* ============================================================
   3. 作品瀑布流
   ------------------------------------------------------------
   文字长短不一时，CSS 多列 (columns) 是最省事的瀑布流方案：
   卡片自动按内容高度错落排列，不需要 JS 计算。
   代价：阅读顺序是「先填满第一列」而不是从左到右逐行。
   ============================================================ */
.works{
  max-width: 1240px;
  margin: 0 auto;
  padding: 32px 24px 80px;
  column-count: 3;          /* 最多 3 列 */
  column-width: 300px;      /* 每列最窄 300px，窄屏自动减列 */
  column-gap: 22px;
}
.poem{
  break-inside: avoid;      /* 关键：不让一张卡片被拆到两列 */
  margin: 0 0 22px;
  padding: 22px 22px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.poem:hover{
  transform: translateY(-3px);
  border-color: #d8cfbc;
  box-shadow: 0 10px 26px rgb(60 50 30 / .11);
}
.poem__top{
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.tag{
  padding: 2px 9px;
  border: 1px solid color-mix(in srgb, var(--seal) 35%, transparent);
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--seal);
}
.poem__date{ font-size: 12px; color: var(--ink-faint); letter-spacing: .06em; }
.poem__title{
  margin: 0 0 12px;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 500;
  letter-spacing: .06em;
}
/* 诗句正文：衬线 + 行高 2 + 保留换行 */
.poem__body{
  position: relative;
  font-family: var(--serif);
  font-size: 16px;
  line-height: 2;
  letter-spacing: .04em;
  white-space: pre-line;    /* 让 \n 真正换行 */
  color: var(--ink);
}
/* 折叠高度由 JS 实测行高后写进 --clamp-h，字号改了也不会错位 */
.poem__body.is-clamped{ max-height: var(--clamp-h, 12rem); overflow: hidden; }
.poem__body.is-clamped::after{
  content:"";
  position: absolute; left: 0; right: 0; bottom: 0; height: 3rem;
  background: linear-gradient(transparent, var(--card));
  pointer-events: none;
}
.poem__more{
  margin-top: 6px;
  padding: 0;
  border: 0; background: none;
  font-size: 13px;
  color: var(--seal);
  text-decoration: underline dotted;
  text-underline-offset: 4px;
}
.poem__foot{
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 16px; padding-top: 12px;
  border-top: 1px dashed var(--line);
  font-size: 13px;
}
.poem__author{ color: var(--ink-soft); letter-spacing: .08em; }
.poem__hint{ color: var(--ink-faint); font-size: 12px; opacity: 0; transition: opacity .2s; }
.poem:hover .poem__hint{ opacity: 1; }

.empty{
  max-width: 1240px; margin: 0 auto; padding: 60px 24px 100px;
  text-align: center; color: var(--ink-faint); font-family: var(--serif);
}

/* ============================================================
   4. 全文弹窗（支持竖排）
   ============================================================ */
.modal{ position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; }
.modal[hidden]{ display: none; }
.modal__backdrop{
  position: absolute; inset: 0;
  background: rgb(31 29 26 / .45);
  backdrop-filter: blur(3px);
  animation: fade .2s ease;
}
.modal__panel{
  position: relative;
  width: min(680px, 100%);
  max-height: 88vh;
  overflow: auto;
  padding: 40px 40px 24px;
  background: var(--card);
  border-radius: 12px;
  box-shadow: 0 24px 60px rgb(0 0 0 / .28);
  animation: rise .26s cubic-bezier(.22,1,.36,1);
}
@keyframes fade{ from{ opacity:0 } }
@keyframes rise{ from{ opacity:0; transform: translateY(14px) } }
.modal__close{
  position: absolute; top: 12px; right: 14px;
  width: 34px; height: 34px;
  border: 0; background: none;
  font-size: 24px; line-height: 1;
  color: var(--ink-faint);
}
.modal__close:hover{ color: var(--ink); }
.modal__genre{ margin: 0 0 10px; font-size: 12px; letter-spacing: .18em; color: var(--seal); }
.modal__title{
  margin: 0 0 22px;
  font-family: var(--serif); font-size: 28px; font-weight: 500; letter-spacing: .1em;
}
.modal__text{
  font-family: var(--serif);
  font-size: 19px;
  line-height: 2.1;
  letter-spacing: .06em;
  white-space: pre-line;
}
/* 竖排模式：writing-mode 会把每个 \n 变成新的一列（从右往左）
   注意：竖排时 line-height 控制的是「字与字的纵向步进」也就是列内字距，
   所以这里必须收紧，否则一行还没排完就换列了。 */
.modal__text.is-vertical{
  writing-mode: vertical-rl;
  line-height: 1.6;
  height: auto;               /* 按内容自然收缩：短诗不再在下方拖一大片空白 */
  max-height: 52vh;           /* 超长作品封顶，多出的部分折成新列 → 左右滑动 */
  overflow-x: auto; overflow-y: hidden;
  padding: 4px 2px;
}
.modal__meta{
  display: flex; justify-content: space-between;
  margin-top: 26px; padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 13px; color: var(--ink-soft); letter-spacing: .08em;
}
.modal__actions{ display: flex; gap: 10px; margin-top: 16px; }

/* ============================================================
   5. 页脚说明
   ============================================================ */
.site-foot{
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 24px 64px;
}
.site-foot__inner{
  padding-top: 20px;
  border-top: 1px solid var(--line);
  color: var(--ink-faint);
  font-size: 12.5px;
  line-height: 2;
}
.site-foot b{ color: var(--seal); font-weight: 600; }
.site-foot code{
  padding: 1px 5px;
  border-radius: 4px;
  background: rgb(0 0 0 / .05);
  font-family: ui-monospace, Consolas, monospace;
  font-size: 12px;
}

/* ============================================================
   6. 统计与互动：浏览 / 点赞 / 收藏 / 评论
   ============================================================ */
.poem__foot{ flex-wrap: wrap; gap: 8px 10px; }
.poem__acts{
  display: flex; align-items: center; gap: 1px;
  margin-left: auto;
}
.act{
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 7px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink-faint);
  transition: color .18s, background .18s, border-color .18s;
}
.act i{ font-style: normal; font-variant-numeric: tabular-nums; }
button.act:hover{ color: var(--ink); background: rgb(0 0 0 / .045); }
button.act[aria-pressed="true"]{
  color: var(--seal);
  border-color: color-mix(in srgb, var(--seal) 30%, transparent);
}
.act--plain{ cursor: default; }

/* 搜索命中高亮 */
mark{
  padding: 0 1px;
  border-radius: 3px;
  background: color-mix(in srgb, var(--seal) 20%, transparent);
  color: inherit;
  font-weight: inherit;
}

.toolbar__count{ align-self: center; font-size: 12px; color: var(--ink-faint); letter-spacing: .06em; }
.sortSelect{
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  font: inherit; font-size: 13px; color: var(--ink-soft);
  cursor: pointer;
}

/* ---- 评论区 ---- */
.cmt{ margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); }
.cmt__title{
  margin: 0 0 16px;
  font-family: var(--serif); font-size: 17px; font-weight: 500; letter-spacing: .08em;
}
.cmt__title span{ color: var(--ink-faint); font-size: 13px; font-family: var(--sans); }
.cmt__list{ list-style: none; margin: 0 0 20px; padding: 0; }
.cmt__item{ padding: 12px 0; border-bottom: 1px dashed var(--line); }
.cmt__item:last-child{ border-bottom: 0; }
.cmt__head{ display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
.cmt__name{ font-size: 13px; letter-spacing: .06em; }
.cmt__time{ font-size: 12px; color: var(--ink-faint); }
.cmt__text{
  margin: 0; font-size: 14px; line-height: 1.85;
  white-space: pre-wrap; word-break: break-word;
}
.cmt__empty{ padding: 6px 0 16px; color: var(--ink-faint); font-size: 13px; }
.cmt__form{ display: grid; gap: 8px; }
.cmt__form input, .cmt__form textarea{
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  font: inherit; font-size: 14px; color: var(--ink);
  resize: vertical;
}
.cmt__form input{ max-width: 220px; }
.cmt__form textarea{ line-height: 1.8; }
.cmt__foot{ display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cmt__hint{ font-size: 12px; color: var(--ink-faint); line-height: 1.6; }
.cmt__hint.is-warn{ color: var(--seal); }

/* ============================================================
   7. 竖排书法模式：毛笔字 + 宣纸 + 墨迹

        Copyright 2018 The MaShanZheng Project Authors

/* 书法字体栈：自带毛笔楷书 → 本机毛笔/行楷 → 楷体 → 衬线兜底
   （本机字体只按名字引用，不打包分发） */
.is-ink .modal__title,
.modal__text.is-vertical{
  font-family:'InkBrush','Ma Shan Zheng',STXingkai,'华文行楷',STKaiti,'Kaiti SC',KaiTi,'楷体',serif;
  font-weight:400;
}

/* 切到书法态：整块弹窗换成宣纸底 */
.modal__panel.is-ink{
  background:
    radial-gradient(130% 90% at 82% 4%, #fffdf6, transparent 58%),
    radial-gradient(80% 60% at 8% 92%, rgb(168 156 132 / .14), transparent 62%),
    repeating-linear-gradient(92deg, rgb(120 100 70 / .022) 0 1px, transparent 1px 4px),
    #f8f2e4;
}
.is-ink .modal__title{ letter-spacing: .16em; color: #17130e; }

/* 竖排正文：墨色 + 宣纸 + 毛边 + 右起扫入（模拟挥毫） */
.modal__text.is-vertical{
  position: relative;
  writing-mode: vertical-rl;
  line-height: 1.6;
  height: auto;               /* 内容多高就多高，短诗不再拖一大片空纸 */
  max-height: 52vh;           /* 超过就封顶，多出的字折成新列 → 左右滑动 */
  /* ⚠️ 宽度必须定死。竖排下 width:auto 会让盒子「按内容撑宽」
     （实测 80 句时涨到 2451px），溢出被推到外层弹窗上，
     于是这里永远不出现横向滚动、滑动提示也永远不触发。
     定成 100% 它才会老老实实在容器内滚动。 */
  width: 100%;
  padding: 14px 10px;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin;                             /* Firefox：细滚动条 */
  scrollbar-color: rgb(22 18 12 / .38) transparent;
  color: #16120c;
  background:
    radial-gradient(120% 80% at 88% 10%, rgb(255 253 246 / .85), transparent 60%),
    #fbf7ec;
  border-radius: 6px;
  box-shadow: inset 0 0 48px rgb(122 104 74 / .16);
  text-shadow: 0 0 1.2px rgb(22 18 12 / .45);      /* 墨在纸上微微洇开 */
  filter: url(#inkRough);                            /* SVG 扰动：毛边飞白 */
  /* 揭示遮罩：静态就设成「完全可见」，这样在禁用动效时文字不会消失 */
  -webkit-mask-image: linear-gradient(to right, transparent 0 40%, #000 60% 100%);
          mask-image: linear-gradient(to right, transparent 0 40%, #000 60% 100%);
  -webkit-mask-size: 250% 100%;   mask-size: 250% 100%;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: 100% 0%; mask-position: 100% 0%;
  animation: inkSweep 2.1s cubic-bezier(.35,0,.25,1) both;
}
@keyframes inkSweep{
  from{ -webkit-mask-position: 0% 0%;   mask-position: 0% 0%; }
  to  { -webkit-mask-position: 100% 0%; mask-position: 100% 0%; }   /* 右起向左推进，贴合竖排笔顺 */
}

/* 落款印章：社徽图片（tools/make-seal.py 抠成透明底后 base64 内联） */
.ink-stage{ position: relative; }
.ink-paper{ position: relative; }
.ink-seal{
  display: none;
  position: absolute;
  left: 16px; bottom: 14px;
  width: 64px; height: 64px;
  opacity: .9;
  pointer-events: none; user-select: none;
}
.is-ink .ink-seal{
  display: block;
  animation: sealDrop .55s cubic-bezier(.2,1.6,.4,1) 1.5s both;
}
/* 作品长到需要左右滑动时，纸上已经没有空处，落款就收起来，免得压在字上 */
.is-ink .ink-stage.is-overflow .ink-seal{ display: none; }
@keyframes sealDrop{
  from{ opacity: 0; transform: rotate(-6deg) scale(1.7); }
  to  { opacity: .9; transform: rotate(-3deg) scale(1); }
}
/* 竖排超出封顶高度、需要左右滑动时的提示 */
.ink-hint{
  display: none;
  margin: 10px 0 0;
  text-align: center;
  font-size: 12px;
  letter-spacing: .18em;
  color: var(--ink-faint);
}
.is-ink .ink-hint.is-on{ display: block; }
/* 细墨色滚动条：让「这里可以滑」这件事看得见 */
.modal__text.is-vertical::-webkit-scrollbar{ height: 8px; }
.modal__text.is-vertical::-webkit-scrollbar-track{
  background: rgb(122 104 74 / .12); border-radius: 4px;
}
.modal__text.is-vertical::-webkit-scrollbar-thumb{
  background: rgb(22 18 12 / .38); border-radius: 4px;
}
.modal__text.is-vertical::-webkit-scrollbar-thumb:hover{ background: rgb(22 18 12 / .55); }
.ink-defs{ position: absolute; width: 0; height: 0; overflow: hidden; }

@media (max-width: 720px){
  .hero{ padding: 40px 20px 26px; }
  .hero__vertical{ display: none; }
  .seal{ top: 44px; right: 20px; width: 48px; height: 48px; font-size: 24px; }
  .toolbar{ padding: 12px 20px 14px; }
  .works{ padding: 22px 20px 60px; column-gap: 16px; }
  .site-foot{ padding: 0 20px 48px; }
  .poem{ padding: 18px 18px 14px; margin-bottom: 16px; }
  .modal__panel{ padding: 32px 22px 20px; }
  .modal__text.is-vertical{ max-height: 44vh; }
}

/* 尊重「减少动效」系统偏好 */
@media (prefers-reduced-motion: reduce){
  *{ animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<!-- 墨迹毛边滤镜：给竖排书法用。宽高 0，不占布局，不影响其他内容 -->
<svg class="ink-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="inkRough" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="3" seed="11" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

</div>

    <button class="modal__close" data-close aria-label="关闭">&times;</button>
    <p class="modal__genre" id="mGenre"></p>
    <h2 class="modal__title" id="mTitle"></h2>

  { title:'旧书', author:'周听雪', genre:'七绝', date:'2026-01',
    lines:['夹页犹存旧日香，','一行批注半遗忘。','多年不读君名字，','忽见签名泪两行。'] },

  { title:'给', author:'林见月', genre:'现代诗', date:'2026-07',
    lines:['我把窗口留给你','连同这个城市','最晚熄灭的那盏灯'] },

  { title:'赠别', author:'顾行舟', genre:'七绝', date:'2026-05',
    lines:['长亭一别各西东，','柳色经年绿又空。','莫问归期何日是，','江南三月正花红。'] },

  { title:'村居', author:'苏晚', genre:'五律', date:'2026-04',
    lines:['结屋依山脚，','开门见水田。','春耕牛背雨，','秋获担头烟。',
           '客至无他事，','茶煎只自便。','平生欢在此，','不羡酒中仙。'] },

  { title:'西江月·夜读', author:'程鹤', genre:'词', date:'2026-10',
    lines:['灯下三更未倦，','案头一卷初开。','古人谈笑似同来，','风雨隔窗不改。',
           '',
           '偶得佳句自喜，','不知鬓已成霜。','合书推枕月当窗，','正是凉宵堪赏。'] },

  { title:'归途', author:'周听雪', genre:'现代诗', date:'2026-11',
    lines:['末班车拖着长长的影子','我数着窗上的雨点','像数这一年没说完的话'] }
];

/* ============================================================
   以下逻辑一般不用改
   ============================================================ */
const CLAMP_LINES = 6;                       // 超过几行折叠
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const state = { q: '', genre: '全部', author: '全部', sort: 'default', onlyMark: false };

/* ---- 每首诗一个「稳定 ID」----
   不要用数组下标！否则以后在中间插一首新诗，已有的浏览/点赞会整体错位挂到别的作品上。 */
const pid  = p => p.id || `${p.title}@${p.author}`;
const byId = new Map(POEMS.map(p => [pid(p), p]));

/* ============================================================
   ★★ 存储层：目前存在访问者浏览器本地（localStorage）
   ------------------------------------------------------------
   ⚠️ 本机版：浏览 / 点赞 / 收藏 / 评论只存在「访问者自己的浏览器」里，
      换个人、换个设备看到的都是各自独立的数字，互不可见。

   要改成真正的全站共享，只需要重写这一个 Store 对象
   （把下面的读写换成 Waline / Twikoo / 自建接口的 HTTP 请求），
   UI 和业务代码一行都不用动。
   ============================================================ */
const LOCAL_NOTE = '演示版：评论与点赞只保存在你自己的浏览器里，别人看不到';
const STORE_KEY  = 'dongting-shishe:stats:v1';
const newStat    = () => ({ views: 0, likes: 0, liked: false, mark: false, comments: [] });

const Store = {
  data: {},

  load(){
    try { this.data = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch { this.data = {}; }                  // 隐私模式下 localStorage 可能不可用
  },
  save(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch {}
  },

  stat(id){ return this.data[id] || newStat(); },        // 只读，不给没互动过的诗建垃圾数据
  ensure(id){ return this.data[id] || (this.data[id] = newStat()); },

  bumpView(id){ this.ensure(id).views++; this.save(); },
  toggleLike(id){
    const s = this.ensure(id);
    s.liked = !s.liked;
    s.likes += s.liked ? 1 : -1;
    this.save(); return s;
  },
  toggleMark(id){
    const s = this.ensure(id);
    s.mark = !s.mark;
    this.save(); return s;
  },
  addComment(id, name, text){
    const s = this.ensure(id);
    s.comments.push({ name: name || '匿名', text, at: Date.now() });
    this.save(); return s;
  },
  markedCount(){ return POEMS.filter(p => this.data[pid(p)]?.mark).length; }
};
Store.load();

/* ---- 初始化页头文案 ---- */
document.title = `${SITE.name} · 作品`;
$('.hero__sub').textContent = `${SITE.name} · ${SITE.subtitle}`;
$('#stats').textContent = `共 ${POEMS.length} 首 · ${new Set(POEMS.map(p => p.author)).size} 位作者`;

/* ---- 生成筛选项：按出现次数排序 ---- */
function countBy(key){
  const m = new Map();
  POEMS.forEach(p => m.set(p[key], (m.get(p[key]) || 0) + 1));
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

function buildChips(el, label, key, values){
  el.innerHTML = `<span class="filters__label">${label}</span>`;
  values.forEach(([name, n]) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.key = key;
    b.dataset.value = name;
    b.setAttribute('aria-pressed', String(state[key] === name));
    b.innerHTML = `${name}<small>${n}</small>`;
    el.appendChild(b);
  });
}
buildChips($('#genreFilters'),  '体裁', 'genre',
  [['全部', POEMS.length], ...countBy('genre')]);
buildChips($('#authorFilters'), '作者', 'author',
  [['全部', POEMS.length], ...countBy('author')]);

/* ---- 转义：诗句、评论都是「用户可控内容」，插进 innerHTML 前必须转义（防 XSS） ---- */
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* ---- 关键词：空格分隔的多个词，全部命中才算匹配（AND 逻辑） ---- */
const terms = () => state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);

/* ---- 筛选 ---- */
function match(p){
  if (state.genre  !== '全部' && p.genre  !== state.genre)  return false;
  if (state.author !== '全部' && p.author !== state.author) return false;
  if (state.onlyMark && !Store.stat(pid(p)).mark)           return false;

  const ts = terms();
  if (!ts.length) return true;
  const hay = [p.title, p.author, p.genre, p.lines.join(' ')].join(' ').toLowerCase();
  return ts.every(t => hay.includes(t));
}

/* ---- 高亮：先按「原始文本」切分，再分别转义 ----
   反过来的话（先转义再正则匹配），搜 "<" 会匹配到自己转义出来的 "&lt;"，把标签切坏。 */
const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function hl(raw, ts = terms()){
  if (!ts.length) return esc(raw);
  const re = new RegExp('(' + ts.map(escapeRe).join('|') + ')', 'gi');
  return String(raw).split(re)
    .map((part, i) => (i % 2) ? `<mark>${esc(part)}</mark>` : esc(part))   // 捕获组：奇数下标即命中
    .join('');
}

/* ---- 排序 ---- */
const SORTS = {
  default:  () => 0,
  likes:    (a, b) => Store.stat(pid(b)).likes - Store.stat(pid(a)).likes,
  views:    (a, b) => Store.stat(pid(b)).views - Store.stat(pid(a)).views,
  comments: (a, b) => Store.stat(pid(b)).comments.length - Store.stat(pid(a)).comments.length
};

/* ---- 渲染 ---- */
function render(){
  const ts   = terms();
  const list = POEMS.filter(match).sort(SORTS[state.sort] || SORTS.default);
  const box  = $('#works');

  // 只负责把卡片画出来；「要不要折叠」交给 applyClamp() 按实测高度决定
  box.innerHTML = list.map(p => {
    const id = pid(p), s = Store.stat(id);
    return `
      <article class="poem" data-pid="${esc(id)}" tabindex="0" role="button"
               aria-label="查看《${esc(p.title)}》全文">
        <div class="poem__top">
          <span class="tag">${esc(p.genre)}</span>
          <time class="poem__date">${esc(p.date)}</time>
        </div>
        <h3 class="poem__title">${hl(p.title, ts)}</h3>
        <div class="poem__body">${hl(p.lines.join('\n'), ts)}</div>
        <div class="poem__foot">
          <span class="poem__author">${hl(p.author, ts)}</span>
          <div class="poem__acts">
            <span class="act act--plain" title="浏览次数">阅<i>${s.views}</i></span>
            <button type="button" class="act" data-act="like" aria-pressed="${s.liked}" title="点赞">赞<i>${s.likes}</i></button>
            <button type="button" class="act" data-act="mark" aria-pressed="${s.mark}" title="收藏">${s.mark ? '已藏' : '收藏'}</button>
            <button type="button" class="act" data-act="cmt" title="查看评论">评<i>${s.comments.length}</i></button>
          </div>
        </div>
      </article>`;
  }).join('');

  $('#empty').hidden = list.length > 0;
  $('#hitCount').textContent = (ts.length || state.onlyMark) ? `筛出 ${list.length} 首` : '';
  $('#markCount').textContent = Store.markedCount();
  applyClamp();
}

/* ---- 就地更新一张卡片的计数（不重绘整列，避免丢失滚动位置和展开状态） ---- */
const cardOf = id => $$('.poem').find(c => c.dataset.pid === id);

function syncCard(id){
  const card = cardOf(id);
  if (!card) return;
  const s = Store.stat(id);
  card.querySelector('.act--plain').innerHTML  = `阅<i>${s.views}</i>`;
  card.querySelector('[data-act="cmt"]').innerHTML = `评<i>${s.comments.length}</i>`;

  const like = card.querySelector('[data-act="like"]');
  like.setAttribute('aria-pressed', String(s.liked));
  like.innerHTML = `赞<i>${s.likes}</i>`;

  const mark = card.querySelector('[data-act="mark"]');
  mark.setAttribute('aria-pressed', String(s.mark));
  mark.textContent = s.mark ? '已藏' : '收藏';

  $('#markCount').textContent = Store.markedCount();
}

/* ---- 折叠：按「实测高度」而不是行数决定 ----
   数行数在数据形态变化时很容易失效（一行装一联、长句自动折行都会算错），
   直接量真实高度最稳。先全部展开量一遍，再逐张决定，
   列宽由 column-count 决定、与内容高度无关，所以前面的折叠不影响后面的测量。 */
function applyClamp(){
  const cards  = $$('.poem');
  const bodies = cards.map(c => c.querySelector('.poem__body'));

  cards.forEach((card, i) => {                       // 第一遍：全部复位
    card.style.removeProperty('--clamp-h');
    bodies[i].classList.remove('is-clamped');
    card.querySelector('.poem__more')?.remove();
  });

  cards.forEach((card, i) => {                       // 第二遍：超高的才折叠
    const body = bodies[i];
    const lh   = parseFloat(getComputedStyle(body).lineHeight) || 32;
    const max  = lh * CLAMP_LINES;
    if (body.scrollHeight <= max + 2) return;

    card.style.setProperty('--clamp-h', max + 'px');  // 折叠高度跟着真实行高走
    body.classList.add('is-clamped');

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'poem__more';
    btn.textContent = '展开全文';
    btn.setAttribute('aria-expanded', 'false');
    body.insertAdjacentElement('afterend', btn);      // 按钮紧跟正文
  });
}

/* ---- 工具栏交互（事件委托，筛选后不用重新绑定） ---- */
document.addEventListener('click', e => {
  // 「只看收藏」要在通用 .chip 分支之前判断——它没有 data-key，否则会写坏 state
  const mo = e.target.closest('#markOnly');
  if (mo){
    state.onlyMark = !state.onlyMark;
    mo.setAttribute('aria-pressed', String(state.onlyMark));
    render();
    return;
  }

  const chip = e.target.closest('.chip');
  if (chip){
    state[chip.dataset.key] = chip.dataset.value;
    $$('.chip').forEach(c => {
      if (c.dataset.key === chip.dataset.key)
        c.setAttribute('aria-pressed', String(c.dataset.value === chip.dataset.value));
    });
    render();
    return;
  }

  // 卡片上的 阅/赞/藏/评：先拦下来，别让点击冒泡去开弹窗
  const act = e.target.closest('.act[data-act]');
  if (act){
    e.stopPropagation();
    const id   = act.closest('.poem').dataset.pid;
    const kind = act.dataset.act;

    if (kind === 'cmt'){ openModal(id, true); return; }      // 直接跳到评论区
    if (kind === 'like') Store.toggleLike(id);
    if (kind === 'mark') Store.toggleMark(id);

    // 正在「只看收藏」时取消了收藏，这张卡要从列表里消失
    if (kind === 'mark' && state.onlyMark) render();
    else syncCard(id);

    if (current && pid(current) === id) syncModal(id);
    return;
  }

  const more = e.target.closest('.poem__more');
  if (more){                                  // 展开/收起，不触发弹窗
    e.stopPropagation();
    const body = more.previousElementSibling;              // 按钮紧跟正文
    const open = !body.classList.toggle('is-clamped');     // toggle 返回「现在是否折叠」
    more.textContent = open ? '收起' : '展开全文';
    more.setAttribute('aria-expanded', String(open));
    return;
  }

  const card = e.target.closest('.poem');
  if (card) openModal(card.dataset.pid);
});

$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('#reset').addEventListener('click', () => {
  Object.assign(state, { q: '', genre: '全部', author: '全部', sort: 'default', onlyMark: false });
  $('#q').value = '';
  $('#sort').value = 'default';
  $('#markOnly').setAttribute('aria-pressed', 'false');
  $$('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.value === '全部')));
  render();
});

/* ---- 弹窗 ---- */
let current = null;

const fmtTime = ts => {
  const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

/* 把一首诗的互动状态同步进弹窗（浏览 / 点赞 / 收藏 / 评论） */
function syncModal(id){
  const s = Store.stat(id);
  $('#mViews').textContent = `阅 ${s.views}`;
  $('#mLikeN').textContent = s.likes;
  $('#mLike').setAttribute('aria-pressed', String(s.liked));
  $('#mMark').setAttribute('aria-pressed', String(s.mark));
  $('#mMark').textContent  = s.mark ? '已收藏' : '收藏';
  renderComments(id);
}

function renderComments(id){
  const list = Store.stat(id).comments;
  $('#mCmtCount').textContent = list.length ? `（${list.length}）` : '';
  const ul = $('#mCmtList');
  if (!list.length){
    ul.innerHTML = '<li class="cmt__empty">还没有评论，来说第一句。</li>';
    return;
  }
  // 新的排最前；name / text 都过 esc()，评论里写 <script> 也注入不进来
  ul.innerHTML = [...list].reverse().map(c => `
    <li class="cmt__item">
      <div class="cmt__head">
        <span class="cmt__name">${esc(c.name)}</span>
        <time class="cmt__time">${fmtTime(c.at)}</time>
      </div>
      <p class="cmt__text">${esc(c.text)}</p>
    </li>`).join('');
}

function openModal(id, toComments = false){
  const p = byId.get(id);
  if (!p) return;
  current = p;

  $('#mGenre').textContent  = p.genre;
  $('#mTitle').textContent  = p.title;
  $('#mText').textContent   = p.lines.join('\n');
  $('#mAuthor').textContent = p.author;
  $('#mDate').textContent   = p.date;

  Store.bumpView(id);                       // 打开一次记一次浏览（本机版＝你自己的次数）
  syncModal(id);
  syncCard(id);

  setVertical(false);
  $('#modal').hidden = false;
  document.body.style.overflow = 'hidden';
  if (toComments) $('#mCmtText').focus();   // 聚焦会自动把评论区滚进视野
  else $('.modal__close').focus();
}

function closeModal(){
  $('#modal').hidden = true;
  document.body.style.overflow = '';
  current = null;
}

/* 书法模式不写标点：传统书写本无标点，去掉后版面清爽
   （横排仍保留标点便于阅读与检索；「复制全文」也保留标点，贴到别处才通顺） */
const PUNCT = /[，。、；：？！…—·「」『』（）《》〈〉“”‘’,.;:?!'"~()\[\]{}]/g;
const inkText = p => p.lines.map(s => String(s).replace(PUNCT, '')).join('\n');

function setVertical(on){
  if (current) $('#mText').textContent = on ? inkText(current) : current.lines.join('\n');
  $('#mText').classList.toggle('is-vertical', on);
  $('.modal__panel').classList.toggle('is-ink', on);     // 整块弹窗切宣纸 + 毛笔字
  $('#mVertical').setAttribute('aria-pressed', String(on));
  $('#mVertical').textContent = on ? '横排阅读' : '竖排阅读';
  if (on) setTimeout(updateInkHint, 80);                 // 等排版稳定后再判断有没有溢出
}

/* 竖排超出封顶高度时，提示可以左右滑动（没溢出就什么都不显示） */
function updateInkHint(){
  const el = $('#mText'), hint = $('#inkHint');
  const over = el.classList.contains('is-vertical') && el.scrollWidth > el.clientWidth + 4;
  hint.classList.toggle('is-on', over);
  hint.textContent = over ? '← 左右滑动读完整首 →' : '';
  // 要滑动说明纸面被字铺满了，落款印章收起来，避免压在字上
  $('.ink-stage').classList.toggle('is-overflow', over);
}

$('#modal').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) closeModal();
});
$('#mVertical').addEventListener('click', () => {
  setVertical($('#mText').classList.contains('is-vertical') === false);
});
$('#mCopy').addEventListener('click', async e => {
  if (!current) return;
  const text = `《${current.title}》 ${current.author}\n\n${current.lines.join('\n')}`;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  e.target.textContent = '已复制';
  setTimeout(() => e.target.textContent = '复制全文', 1400);
});

/* ---- 弹窗里的点赞 / 收藏 ---- */
$('#mLike').addEventListener('click', () => {
  if (!current) return;
  const id = pid(current);
  Store.toggleLike(id);
  syncModal(id); syncCard(id);
});
$('#mMark').addEventListener('click', () => {
  if (!current) return;
  const id = pid(current);
  Store.toggleMark(id);
  if (state.onlyMark) render(); else syncCard(id);   // 取消收藏后要从「只看收藏」里移出
  syncModal(id);
});

/* ---- 发表评论 ---- */
$('#mCmtForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!current) return;

  const hint = $('#mCmtHint');
  const text = $('#mCmtText').value.trim();
  if (!text){
    hint.textContent = '先写点什么再发表～';
    hint.classList.add('is-warn');
    $('#mCmtText').focus();
    return;
  }

  const id = pid(current);
  Store.addComment(id, $('#mCmtName').value.trim().slice(0, 16), text.slice(0, 200));
  $('#mCmtText').value = '';
  hint.textContent = LOCAL_NOTE;
  hint.classList.remove('is-warn');
  syncModal(id); syncCard(id);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  // 卡片支持键盘打开（只在卡片本身聚焦时拦 Enter/空格，不影响输入框）
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('poem')){
    e.preventDefault(); openModal(e.target.dataset.pid);
  }
});

$('#mCmtHint').textContent = LOCAL_NOTE;
render();

/* 字体加载完成、以及窗口尺寸变化（列数变了折行也会变）之后，重新判定要不要折叠 */
let _rt;
addEventListener('resize', () => { clearTimeout(_rt); _rt = setTimeout(applyClamp, 150); });
addEventListener('resize', updateInkHint);   // 竖排时宽度变了要重新判断是否需要左右滑动
if (document.fonts && document.fonts.ready) document.fonts.ready.then(applyClamp);
</script>
